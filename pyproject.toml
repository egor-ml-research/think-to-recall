[project]
name = "cotrail"
version = "0.7.0"
description = "cotrail: local decision memory for AI coding assistants (MCP server for Claude Code)"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.11"
# The decision memory (cotrail CLI + MCP server) needs only these: recall is BM25, no model. `quality` adds the
# int8 ONNX encoder (no PyTorch). Research code (benchmarks, PPR graph, WordNet / RuWordNet) is in the `bench` extra.
dependencies = [
    "pymorphy3>=2.0",
    "yake>=0.4",
    "numpy>=1.26",
    "requests>=2.31",
    "mcp>=1.0",
    "networkx>=3",
    "nltk>=3.8",  # WordNet: topic names and English concept filtering (data downloaded by `setup`)
]

[project.scripts]
cotrail = "cotrail.cli:main"
cotrail-mcp = "cotrail.memory_mcp:main"
# the old name, until 2027-02: a one-line hint on stderr, then the same command
ctxgraph = "cotrail.legacy:cli_main"
ctxgraph-mcp = "cotrail.legacy:mcp_main"

[project.gui-scripts]
# Windows: a GUI-subsystem launcher, so a GUI client (Claude Desktop, Claude Code desktop) starting the server over
# stdio opens no console window. Same server as `cotrail-mcp`; on macOS / Linux it is an ordinary script.
cotrail-mcpw = "cotrail.memory_mcp:main"
ctxgraph-mcpw = "cotrail.legacy:mcpw_main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
memory = []  # kept for old install commands: the memory needs nothing beyond the base dependencies
# `cotrail setup --quality`: BM25 + multilingual-e5-base (int8 ONNX on onnxruntime, ~300 MB model)
quality = ["onnxruntime>=1.17", "tokenizers>=0.15", "huggingface_hub>=0.23"]
# better English concepts in the graph view (spaCy parser + WordNet); recall does not use them
# The spaCy model is not a dependency (PyPI refuses direct URLs): `python -m spacy download en_core_web_sm`
english = ["spacy>=3.7,<4", "nltk>=3.8"]
bench = ["onnxruntime>=1.17", "tokenizers>=0.15", "huggingface_hub>=0.23", "spacy>=3.7,<4", "sentence-transformers>=3", "scipy>=1.11", "pyarrow>=15", "nltk>=3.8", "ruwordnet>=0.0.6",
         "model2vec>=0.4", "python-dotenv>=1", "rank-bm25>=0.2", "everalgo-core==0.2.0", "everalgo-rank==0.3.0",
         "everalgo-clustering==0.2.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cotrail*"]

[tool.setuptools.package-data]
cotrail = ["viewer_template.html", "viewer_cosmos.js", "viewer_flow.js", "viewer_i18n.js", "vendor/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# Длину строк держит `ruff format`; оставшиеся длинные строки — регулярки, SQL и URL.
ignore = ["E501", "SIM905"]  # SIM905: списки слов читаемее строкой со split()

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: tests that call Wikidata / download models (deselect with -m 'not network')"]
