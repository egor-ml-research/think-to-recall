[project]
name = "think-to-recall"
version = "0.2.1"
description = "ctxgraph: local decision memory for AI coding assistants (MCP server for Claude Code)"
requires-python = ">=3.11"
# The decision memory (ctxgraph CLI + MCP server) needs only these: the encoder runs as int8 ONNX on onnxruntime,
# no PyTorch. Research code (benchmarks, the PPR graph, WordNet / RuWordNet sources) is in the `bench` extra.
dependencies = [
    "pymorphy3>=2.0",
    "yake>=0.4",
    "numpy>=1.26",
    "requests>=2.31",
    "mcp>=1.0",
    "onnxruntime>=1.17",
    "tokenizers>=0.15",
    "huggingface_hub>=0.23",
    "networkx>=3",
]

[project.scripts]
ctxgraph = "ctxgraph.cli:main"
ctxgraph-mcp = "ctxgraph.memory_mcp:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
memory = []  # kept for old install commands: the memory needs nothing beyond the base dependencies
# better English concepts in the graph view (spaCy parser + WordNet); recall does not use them
english = ["spacy>=3.7,<4", "nltk>=3.8",
           "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl"]
bench = ["spacy>=3.7,<4", "sentence-transformers>=3", "scipy>=1.11", "pyarrow>=15", "nltk>=3.8", "ruwordnet>=0.0.6",
         "model2vec>=0.4", "python-dotenv>=1", "rank-bm25>=0.2", "everalgo-core==0.2.0", "everalgo-rank==0.3.0",
         "everalgo-clustering==0.2.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ctxgraph*"]

[tool.setuptools.package-data]
ctxgraph = ["viewer_template.html", "vendor/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# Длину строк держит `ruff format`; оставшиеся длинные строки — регулярки, SQL и URL.
ignore = ["E501", "SIM905"]  # SIM905: списки слов читаемее строкой со split()

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: tests that call Wikidata / download models (deselect with -m 'not network')"]
